<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PvZ Мультиплеер</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            background:#1a1a2e; 
            display:flex; 
            justify-content:center; 
            align-items:center; 
            min-height:100vh; 
            font-family:'Segoe UI',Arial,sans-serif;
            touch-action: manipulation;
        }
        .wrapper { 
            display:flex; 
            flex-direction:column; 
            align-items:center; 
            gap:10px; 
            padding:10px;
            width:100%;
            max-width:960px;
        }
        h1 { color:#fff; font-size:clamp(1.2em, 4vw, 2em); text-align:center; }
        h1 span { color:#ff5722; }
        canvas { 
            border:3px solid #2a2a4a; 
            border-radius:12px; 
            width:100%; 
            height:auto;
            max-width:950px;
            cursor:crosshair;
            touch-action: manipulation;
        }
        .panel { 
            display:flex; 
            gap:10px; 
            background:#16213e; 
            padding:10px 20px; 
            border-radius:10px; 
            align-items:center; 
            flex-wrap:wrap;
            justify-content:center;
        }
        .role { padding:8px 16px; border-radius:20px; font-weight:700; }
        .defender { background:rgba(76,175,80,0.3); color:#c8e6c9; border:2px solid #4caf50; }
        .attacker { background:rgba(255,87,34,0.3); color:#ffab91; border:2px solid #ff5722; }
        .score { color:#fff; font-size:1.5em; font-weight:900; }
        .hint { color:#aaa; font-size:0.85em; text-align:center; }
        kbd { background:#333; padding:2px 6px; border-radius:3px; color:#fff; }
        
        /* Кнопки для атакующего на телефоне */
        .zombie-buttons {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            padding: 10px;
        }
        .zombie-buttons.visible {
            display: flex;
        }
        .zombie-btn {
            padding: 12px 16px;
            border: 2px solid #555;
            border-radius: 10px;
            background: #333;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            min-width: 55px;
            touch-action: manipulation;
        }
        .zombie-btn:active {
            background: #ff5722;
            border-color: #ff5722;
            transform: scale(0.95);
        }
        .zombie-btn.row-btn {
            background: #4a148c;
            border-color: #6a1b9a;
        }
        .zombie-btn.special {
            background: #bf360c;
            border-color: #e64a19;
        }
        .btn-restart {
            padding: 10px 20px;
            background: #ff9800;
            color: #000;
            border: none;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <h1>🌱 Растения <span>VS</span> Зомби 🧟</h1>
    <canvas id="game" width="950" height="600"></canvas>
    <div class="panel">
        <span id="role" class="role">Подключение...</span>
        <span class="score" id="score">0 : 0</span>
        <button class="btn-restart" onclick="location.reload()">🔄 Рестарт</button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="zombie-buttons" id="zombieBtns">
        <button class="zombie-btn row-btn" data-type="basic" data-row="0">Ряд 1</button>
        <button class="zombie-btn row-btn" data-type="basic" data-row="1">Ряд 2</button>
        <button class="zombie-btn row-btn" data-type="basic" data-row="2">Ряд 3</button>
        <button class="zombie-btn row-btn" data-type="basic" data-row="3">Ряд 4</button>
        <button class="zombie-btn row-btn" data-type="basic" data-row="4">Ряд 5</button>
        <button class="zombie-btn special" data-type="cone">Конус</button>
        <button class="zombie-btn special" data-type="bucket">Ведро</button>
        <button class="zombie-btn special" id="hordeBtn">Орда</button>
    </div>
</div>

<script>
const socket = io();
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let myRole = null;
let gameData = {};
let selectedPlant = null;

const COLORS = {
    sunflower: '#ffeb3b', peashooter: '#4caf50', walnut: '#8d6e63',
    snowpea: '#81d4fa', cherrybomb: '#f44336',
    basic: '#9ccc65', cone: '#ff9800', bucket: '#795548'
};

const COSTS = {
    sunflower: 50, peashooter: 100, walnut: 50, snowpea: 175, cherrybomb: 150
};

// Получение роли
socket.on('role', (role) => {
    myRole = role;
    document.getElementById('role').textContent = role === 'defender' ? '🛡️ Защитник' : '🧟 Атакующий';
    document.getElementById('role').className = 'role ' + role;
    
    if (role === 'attacker') {
        document.getElementById('hint').innerHTML = '👆 Используйте кнопки ниже (или клавиатуру на ПК)';
        document.getElementById('zombieBtns').classList.add('visible');
    } else {
        document.getElementById('hint').innerHTML = '🖱️ Выберите растение сверху → кликните по клетке поля. Солнце — клик для сбора';
    }
});

// Получение состояния
socket.on('state', (data) => {
    gameData = data;
    document.getElementById('score').textContent = `${data.score1} : ${data.score2}`;
});

// Отрисовка
function draw() {
    ctx.clearRect(0, 0, 950, 600);
    
    if (!gameData.plants) return;
    
    // Поле
    for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 9; c++) {
            ctx.fillStyle = (r + c) % 2 === 0 ? '#7cb342' : '#8bc34a';
            ctx.fillRect(150 + c * 85, 120 + r * 90, 83, 88);
        }
    }
    
    // Верхняя панель для защитника
    if (myRole === 'defender') {
        ctx.fillStyle = '#1b5e20';
        ctx.fillRect(0, 0, 950, 80);
        
        const types = Object.keys(COSTS);
        types.forEach((type, i) => {
            const x = 10 + i * 110;
            const canBuy = gameData.sunPoints >= COSTS[type];
            ctx.fillStyle = selectedPlant === type ? '#fff9c4' : (canBuy ? '#c8e6c9' : '#666');
            ctx.fillRect(x, 10, 100, 60);
            ctx.fillStyle = COLORS[type];
            ctx.beginPath(); ctx.arc(x + 50, 30, 15, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = '11px Arial';
            ctx.fillText(type, x + 50, 55);
            ctx.fillText('☀' + COSTS[type], x + 50, 68);
        });
        
        ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Arial';
        ctx.fillText('☀ ' + (gameData.sunPoints || 0), 580, 50);
    }
    
    // Панель для атакующего
    if (myRole === 'attacker') {
        ctx.fillStyle = '#4a148c';
        ctx.fillRect(0, 0, 950, 80);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Arial';
        ctx.fillText('⚡ ' + (gameData.zombieEnergy || 0) + ' / 250', 20, 50);
    }
    
    // Солнце
    if (gameData.sunDrops) {
        gameData.sunDrops.forEach(s => {
            if (!s.alive && s.alive !== undefined) return;
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath(); ctx.arc(s.x, s.y, 8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.fillText('☀', s.x - 7, s.y + 5);
        });
    }
    
    // Растения
    if (gameData.plants) {
        gameData.plants.forEach(p => {
            ctx.fillStyle = COLORS[p.type] || '#888';
            ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI*2); ctx.fill();
            
            // HP бар
            if (p.hp < p.maxHp) {
                ctx.fillStyle = '#333';
                ctx.fillRect(p.x - 15, p.y - 25, 30, 4);
                ctx.fillStyle = p.hp / p.maxHp > 0.5 ? '#4caf50' : '#ff9800';
                ctx.fillRect(p.x - 15, p.y - 25, 30 * (p.hp / p.maxHp), 4);
            }
        });
    }
    
    // Зомби
    if (gameData.zombies) {
        gameData.zombies.forEach(z => {
            ctx.fillStyle = COLORS[z.type] || '#9ccc65';
            ctx.fillRect(z.x - 10, z.y - 15, 20, 30);
            ctx.fillStyle = '#c8e6c9';
            ctx.beginPath(); ctx.arc(z.x, z.y - 18, 10, 0, Math.PI*2); ctx.fill();
            
            if (z.slowed) {
                ctx.fillStyle = 'rgba(130,210,255,0.4)';
                ctx.beginPath(); ctx.arc(z.x, z.y, 20, 0, Math.PI*2); ctx.fill();
            }
        });
    }
    
    // Снаряды
    if (gameData.projectiles) {
        gameData.projectiles.forEach(p => {
            ctx.fillStyle = p.slow ? '#81d4fa' : '#a5d6a7';
            ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill();
        });
    }
    
    // Конец игры
    if (gameData.gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, 950, 600);
        ctx.fillStyle = '#fff'; ctx.font = '36px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(
            gameData.winner === 'defender' ? '🌱 Защитник победил!' : '🧟 Атакующий победил!', 
            475, 300
        );
    }
}

// Обработка кликов/касаний
canvas.addEventListener('click', (e) => {
    if (myRole !== 'defender' || gameData.gameOver) return;
    
    const rect = canvas.getBoundingClientRect();
    const scaleX = 950 / rect.width;
    const scaleY = 600 / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;
    
    // Сбор солнца
    if (gameData.sunDrops) {
        for (let i = 0; i < gameData.sunDrops.length; i++) {
            const s = gameData.sunDrops[i];
            if (s.alive === false) continue;
            if (Math.hypot(x - s.x, y - s.y) < 25) {
                socket.emit('collect', { id: i });
                return;
            }
        }
    }
    
    // Выбор растения в верхней панели
    if (y < 80) {
        const types = Object.keys(COSTS);
        for (let i = 0; i < types.length; i++) {
            const bx = 10 + i * 110;
            if (x >= bx && x <= bx + 100 && gameData.sunPoints >= COSTS[types[i]]) {
                selectedPlant = selectedPlant === types[i] ? null : types[i];
                return;
            }
        }
    }
    
    // Посадка
    if (selectedPlant && y > 120) {
        const col = Math.floor((x - 150) / 85);
        const row = Math.floor((y - 120) / 90);
        if (col >= 0 && col < 9 && row >= 0 && row < 5) {
            socket.emit('plant', { type: selectedPlant, row, col });
        }
    }
});

// Кнопки для атакующего (телефон)
document.querySelectorAll('.zombie-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        if (myRole !== 'attacker' || gameData.gameOver) return;
        
        if (btn.id === 'hordeBtn') {
            socket.emit('horde');
        } else {
            const type = btn.dataset.type;
            const row = btn.dataset.row !== undefined ? parseInt(btn.dataset.row) : Math.floor(Math.random() * 5);
            socket.emit('zombie', { type, row });
        }
    });
});

// Клавиатура для атакующего (ПК)
document.addEventListener('keydown', (e) => {
    if (myRole !== 'attacker' || gameData.gameOver) return;
    
    const key = e.key.toLowerCase();
    if (key >= '1' && key <= '5') {
        socket.emit('zombie', { type: 'basic', row: parseInt(key) - 1 });
    } else if (key === 'q') {
        socket.emit('zombie', { type: 'cone', row: Math.floor(Math.random() * 5) });
    } else if (key === 'w') {
        socket.emit('zombie', { type: 'bucket', row: Math.floor(Math.random() * 5) });
    } else if (key === 'e') {
        socket.emit('horde');
    }
});

function gameLoop() {
    draw();
    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
