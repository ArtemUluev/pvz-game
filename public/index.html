<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PvZ Мультиплеер v2.0</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#1a1a2e;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            font-family:'Segoe UI',Arial,sans-serif;
            touch-action:manipulation;
            user-select:none;
        }
        .wrapper{
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:8px;
            padding:5px;
            width:100%;
            max-width:960px;
        }
        h1{color:#fff;font-size:clamp(1.2em,4vw,1.8em);text-align:center}
        h1 span{color:#ff5722}
        canvas{
            width:100%;
            max-width:950px;
            border:2px solid #333;
            border-radius:10px;
            cursor:crosshair;
            background:#000;
        }
        .panel{
            display:flex;
            gap:10px;
            background:#16213e;
            padding:8px 16px;
            border-radius:8px;
            align-items:center;
            flex-wrap:wrap;
            justify-content:center;
        }
        .role{
            padding:6px 14px;
            border-radius:16px;
            font-weight:700;
            font-size:14px;
        }
        .defender{background:rgba(76,175,80,0.3);color:#a5d6a7;border:1px solid #4caf50}
        .attacker{background:rgba(255,87,34,0.3);color:#ffab91;border:1px solid #ff5722}
        .score{color:#fff;font-size:1.3em;font-weight:900}
        .timer{color:#ffeb3b;font-weight:700;font-size:1.1em}
        
        .mode-select{
            display:none;
            flex-direction:column;
            gap:15px;
            align-items:center;
            padding:20px;
            background:#16213e;
            border-radius:12px;
        }
        .mode-select.show{display:flex}
        .mode-btn{
            padding:12px 24px;
            border:none;
            border-radius:10px;
            font-weight:700;
            font-size:1em;
            cursor:pointer;
            color:#fff;
            width:250px;
        }
        .mode-endless{background:#4caf50}
        .mode-versus{background:#ff5722}
        
        .zombie-btns{
            display:none;
            flex-wrap:wrap;
            gap:6px;
            justify-content:center;
        }
        .zombie-btns.show{display:flex}
        .zombie-btn{
            padding:10px 14px;
            border:none;
            border-radius:8px;
            font-weight:700;
            color:#fff;
            cursor:pointer;
            font-size:13px;
            min-width:50px;
        }
        .zombie-btn:active{transform:scale(0.95);opacity:0.8}
        .row-btn{background:#4a148c}
        .special{background:#bf360c}
        .horde-btn{background:#e65100}
        
        .btn{
            padding:10px 20px;
            border:none;
            border-radius:20px;
            font-weight:700;
            cursor:pointer;
            color:#fff;
        }
        .btn-next{background:#2196f3}
        .btn-restart{background:#ff9800;color:#000}
        
        .message{
            color:#ffeb3b;
            font-weight:700;
            text-align:center;
            padding:5px;
            min-height:24px;
        }
        .info{color:#aaa;font-size:0.85em;text-align:center}
        kbd{background:#333;padding:2px 6px;border-radius:3px;color:#fff}
    </style>
</head>
<body>
<div class="wrapper">
    <h1>🌱 Растения <span>VS</span> Зомби 🧟</h1>
    
    <div class="mode-select" id="modeSelect">
        <h3 style="color:#fff;">Выберите режим:</h3>
        <button class="mode-btn mode-endless" onclick="selectMode('endless')">🏰 Бесконечный бой</button>
        <button class="mode-btn mode-versus" onclick="selectMode('versus')">⚔️ Соревновательный (4 раунда)</button>
    </div>
    
    <canvas id="game" width="950" height="600"></canvas>
    
    <div class="message" id="message"></div>
    
    <div class="panel">
        <span id="roleDisplay" class="role">Ожидание...</span>
        <span class="score" id="scoreDisplay">0 : 0</span>
        <span class="timer" id="timerDisplay"></span>
    </div>
    
    <div class="zombie-btns" id="zombieBtns">
        <button class="zombie-btn row-btn" onclick="spawnZombie('basic',0)">Ряд 1</button>
        <button class="zombie-btn row-btn" onclick="spawnZombie('basic',1)">Ряд 2</button>
        <button class="zombie-btn row-btn" onclick="spawnZombie('basic',2)">Ряд 3</button>
        <button class="zombie-btn row-btn" onclick="spawnZombie('basic',3)">Ряд 4</button>
        <button class="zombie-btn row-btn" onclick="spawnZombie('basic',4)">Ряд 5</button>
        <button class="zombie-btn special" onclick="spawnZombie('cone',-1)">Конус</button>
        <button class="zombie-btn special" onclick="spawnZombie('bucket',-1)">Ведро</button>
        <button class="zombie-btn horde-btn" onclick="spawnHorde()">Орда</button>
    </div>
    
    <div style="display:flex;gap:10px;">
        <button class="btn btn-next" id="btnNext" style="display:none;" onclick="nextRound()">▶ Следующий раунд</button>
        <button class="btn btn-restart" onclick="restartGame()">🔄 Рестарт</button>
    </div>
    
    <div class="info" id="infoText"></div>
</div>

<script>
const socket = io();
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let myRole = null;
let isHost = false;
let gameData = {};
let selectedPlant = null;

const COLORS = {
    sunflower:'#ffeb3b', peashooter:'#4caf50', walnut:'#8d6e63',
    snowpea:'#81d4fa', cherrybomb:'#f44336',
    basic:'#9ccc65', cone:'#ff9800', bucket:'#795548'
};
const COSTS = {sunflower:50,peashooter:100,walnut:50,snowpea:175,cherrybomb:150};

// Получение роли
socket.on('role', (role) => {
    myRole = role;
    updateRoleDisplay();
});

socket.on('isHost', (host) => {
    isHost = host;
    if (isHost && !gameData.mode) {
        document.getElementById('modeSelect').classList.add('show');
    }
});

socket.on('state', (data) => {
    gameData = data;
    updateUI();
});

socket.on('message', (msg) => {
    document.getElementById('message').textContent = msg;
});

function updateRoleDisplay() {
    const el = document.getElementById('roleDisplay');
    if (myRole === 'defender') {
        el.textContent = '🛡️ Защитник';
        el.className = 'role defender';
        document.getElementById('zombieBtns').classList.remove('show');
        document.getElementById('infoText').innerHTML = '🖱️ Выберите растение сверху → клик по полю';
    } else if (myRole === 'attacker') {
        el.textContent = '🧟 Атакующий';
        el.className = 'role attacker';
        document.getElementById('zombieBtns').classList.add('show');
        document.getElementById('infoText').innerHTML = '👆 Кнопки или <kbd>1-5</kbd> <kbd>Q</kbd> <kbd>W</kbd> <kbd>E</kbd>';
    }
}

function updateUI() {
    document.getElementById('scoreDisplay').textContent = `${gameData.score1||0} : ${gameData.score2||0}`;
    
    if (gameData.phase === 'prep') {
        document.getElementById('timerDisplay').textContent = `Подготовка: ${gameData.prepTimer}с`;
    } else if (gameData.phase === 'playing') {
        const mins = Math.floor(gameData.gameTimer/60);
        const secs = Math.floor(gameData.gameTimer%60);
        document.getElementById('timerDisplay').textContent = `⏱ ${mins}:${String(secs).padStart(2,'0')}`;
    } else {
        document.getElementById('timerDisplay').textContent = '';
    }
    
    if (gameData.phase === 'result' && gameData.mode === 'versus' && gameData.round < 3) {
        document.getElementById('btnNext').style.display = 'inline-block';
    } else {
        document.getElementById('btnNext').style.display = 'none';
    }
    
    if (gameData.phase === 'gameover' && gameData.mode === 'versus') {
        document.getElementById('message').textContent = 
            `Матч окончен! Победы: ${gameData.roundsWon?.[0]||0} - ${gameData.roundsWon?.[1]||0}`;
    }
}

function selectMode(mode) {
    socket.emit('selectMode', mode);
    document.getElementById('modeSelect').classList.remove('show');
}

function spawnZombie(type, row) {
    if (row < 0) row = Math.floor(Math.random() * 5);
    socket.emit('zombie', { type, row });
}

function spawnHorde() {
    socket.emit('horde');
}

function nextRound() {
    socket.emit('nextRound');
}

function restartGame() {
    socket.emit('restart');
    document.getElementById('modeSelect').classList.add('show');
}

// Отрисовка
function draw() {
    ctx.clearRect(0, 0, 950, 600);
    
    if (!gameData.plants) {
        ctx.fillStyle = '#fff';
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Ожидание игроков...', 475, 300);
        return;
    }
    
    // Газон
    for (let r=0; r<5; r++) {
        for (let c=0; c<9; c++) {
            ctx.fillStyle = (r+c)%2===0 ? '#7cb342' : '#8bc34a';
            ctx.fillRect(150 + c*85, 120 + r*90, 83, 88);
        }
    }
    
    // Газонокосилки
    if (gameData.lawnmowers) {
        gameData.lawnmowers.forEach((active, row) => {
            if (active) {
                ctx.fillStyle = '#c62828';
                ctx.fillRect(115, 145 + row*90, 30, 15);
                ctx.fillStyle = '#fff';
                ctx.font = '8px Arial';
                ctx.fillText('ГАЗОН', 116, 155 + row*90);
            }
        });
    }
    
    // Верхняя панель защитника
    if (myRole === 'defender') {
        ctx.fillStyle = '#1b5e20';
        ctx.fillRect(0, 0, 950, 80);
        
        Object.keys(COSTS).forEach((type, i) => {
            const x = 10 + i*110;
            const canBuy = (gameData.sunPoints||0) >= COSTS[type];
            ctx.fillStyle = selectedPlant===type ? '#fff9c4' : (canBuy ? '#c8e6c9' : '#666');
            ctx.fillRect(x, 10, 100, 60);
            ctx.fillStyle = COLORS[type];
            ctx.beginPath(); ctx.arc(x+50, 30, 15, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = '11px Arial'; ctx.textAlign = 'center';
            ctx.fillText(type === 'sunflower' ? 'Подсолнух' : type === 'peashooter' ? 'Горох' : type === 'walnut' ? 'Орех' : type === 'snowpea' ? 'Ледяной' : 'Бомба', x+50, 55);
            ctx.fillText('☀'+COSTS[type], x+50, 68);
        });
        ctx.textAlign = 'left';
        ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Arial';
        ctx.fillText('☀ ' + (gameData.sunPoints||0), 580, 50);
    }
    
    // Панель атакующего
    if (myRole === 'attacker') {
        ctx.fillStyle = '#4a148c';
        ctx.fillRect(0, 0, 950, 80);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Arial';
        ctx.fillText('⚡ ' + (gameData.zombieEnergy||0) + ' / 250', 20, 50);
        if (gameData.spawnLocked) {
            ctx.fillStyle = '#ff5722'; ctx.font = '14px Arial';
            ctx.fillText('Спавн через ' + (gameData.prepTimer||0) + 'с', 20, 70);
        }
    }
    
    // Солнце
    if (gameData.sunDrops) {
        gameData.sunDrops.forEach((s, i) => {
            if (s.alive === false) return;
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath(); ctx.arc(s.x, s.y, 8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
            ctx.fillText('☀', s.x, s.y+4);
        });
    }
    ctx.textAlign = 'left';
    
    // Растения
    if (gameData.plants) {
        gameData.plants.forEach(p => {
            ctx.fillStyle = COLORS[p.type] || '#888';
            ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI*2); ctx.fill();
            if (p.hp < p.maxHp) {
                ctx.fillStyle = '#333';
                ctx.fillRect(p.x-15, p.y-25, 30, 4);
                ctx.fillStyle = p.hp/p.maxHp > 0.5 ? '#4caf50' : '#ff9800';
                ctx.fillRect(p.x-15, p.y-25, 30*(p.hp/p.maxHp), 4);
            }
        });
    }
    
    // Зомби
    if (gameData.zombies) {
        gameData.zombies.forEach(z => {
            ctx.fillStyle = COLORS[z.type] || '#9ccc65';
            ctx.fillRect(z.x-10, z.y-15, 20, 30);
            ctx.fillStyle = '#c8e6c9';
            ctx.beginPath(); ctx.arc(z.x, z.y-18, 10, 0, Math.PI*2); ctx.fill();
            if (z.slowed) {
                ctx.fillStyle = 'rgba(130,210,255,0.4)';
                ctx.beginPath(); ctx.arc(z.x, z.y, 20, 0, Math.PI*2); ctx.fill();
            }
        });
    }
    
    // Снаряды
    if (gameData.projectiles) {
        gameData.projectiles.forEach(p => {
            ctx.fillStyle = p.slow ? '#81d4fa' : '#a5d6a7';
            ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill();
        });
    }
    
    // Конец игры / результат
    if (gameData.gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, 950, 600);
        ctx.fillStyle = '#fff'; ctx.font = '30px Arial'; ctx.textAlign = 'center';
        if (gameData.winner === 'defender') {
            ctx.fillText('🌱 Защитник выстоял!', 475, 280);
        } else if (gameData.winner === 'attacker') {
            ctx.fillText('🧟 Зомби прорвались!', 475, 280);
        } else {
            ctx.fillText('⏰ Время вышло!', 475, 280);
        }
        ctx.font = '20px Arial';
        ctx.fillText(`Счёт: ${gameData.score1} - ${gameData.score2}`, 475, 320);
    }
    
    ctx.textAlign = 'left';
}

// Клики по канвасу
canvas.addEventListener('click', (e) => {
    if (myRole !== 'defender' || gameData.gameOver || gameData.phase !== 'playing') return;
    
    const rect = canvas.getBoundingClientRect();
    const scaleX = 950 / rect.width;
    const scaleY = 600 / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;
    
    // Сбор солнца
    if (gameData.sunDrops) {
        for (let i = 0; i < gameData.sunDrops.length; i++) {
            const s = gameData.sunDrops[i];
            if (s.alive === false) continue;
            if (Math.hypot(x - s.x, y - s.y) < 25) {
                socket.emit('collect', { id: i });
                return;
            }
        }
    }
    
    // Выбор растения
    if (y < 80) {
        const types = Object.keys(COSTS);
        for (let i = 0; i < types.length; i++) {
            const bx = 10 + i*110;
            if (x >= bx && x <= bx+100 && (gameData.sunPoints||0) >= COSTS[types[i]]) {
                selectedPlant = selectedPlant === types[i] ? null : types[i];
                return;
            }
        }
    }
    
    // Посадка
    if (selectedPlant && y > 120) {
        const col = Math.floor((x - 150) / 85);
        const row = Math.floor((y - 120) / 90);
        if (col >= 0 && col < 9 && row >= 0 && row < 5) {
            socket.emit('plant', { type: selectedPlant, row, col });
        }
    }
});

// Клавиатура для атакующего
document.addEventListener('keydown', (e) => {
    if (myRole !== 'attacker' || gameData.gameOver || gameData.spawnLocked) return;
    
    const key = e.key.toLowerCase();
    if (key >= '1' && key <= '5') {
        socket.emit('zombie', { type: 'basic', row: parseInt(key)-1 });
    } else if (key === 'q') {
        socket.emit('zombie', { type: 'cone', row: Math.floor(Math.random()*5) });
    } else if (key === 'w') {
        socket.emit('zombie', { type: 'bucket', row: Math.floor(Math.random()*5) });
    } else if (key === 'e') {
        socket.emit('horde');
    }
});

function gameLoop() {
    draw();
    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
