<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PvZ v4.1</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Segoe UI,Arial;touch-action:manipulation;user-select:none}
        .wrapper{display:flex;flex-direction:column;align-items:center;gap:6px;padding:5px;width:100%;max-width:960px}
        h1{color:#fff;font-size:1.4em;text-align:center} h1 span{color:#ff5722}
        canvas{width:100%;max-width:950px;border:2px solid #333;border-radius:10px;cursor:crosshair;background:#000}
        .panel{display:flex;gap:8px;background:#16213e;padding:6px 14px;border-radius:8px;align-items:center;flex-wrap:wrap;justify-content:center}
        .role{padding:5px 12px;border-radius:14px;font-weight:700;font-size:13px}
        .defender{background:rgba(76,175,80,0.3);color:#a5d6a7;border:1px solid #4caf50}
        .attacker{background:rgba(255,87,34,0.3);color:#ffab91;border:1px solid #ff5722}
        .score{color:#fff;font-size:1.2em;font-weight:900}
        .timer{color:#ffeb3b;font-weight:700}
        .screen{display:none;flex-direction:column;gap:12px;align-items:center;padding:18px;background:#16213e;border-radius:12px;color:#fff;width:100%;max-width:900px}
        .screen.show{display:flex}
        .mode-btn{padding:10px 20px;border:none;border-radius:8px;font-weight:700;cursor:pointer;color:#fff;width:220px}
        .endless{background:#4caf50} .versus{background:#ff5722} .start-btn{background:#2196f3;width:200px}
        .grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
        .card{width:70px;height:80px;border-radius:8px;border:2px solid #555;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-align:center;background:#333}
        .card.selected{border-color:#ffeb3b;box-shadow:0 0 8px #ffeb3b;background:#4a4a2e}
        .card .icon{font-size:22px}

        /* стили для слотов зомби */
        .zombie-slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
        .zombie-slot{width:75px;height:90px;border-radius:8px;border:2px solid #555;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-align:center;background:#333;position:relative}
        .zombie-slot.locked{opacity:0.6;cursor:default}
        .zombie-slot:not(.locked){cursor:pointer}
        .zombie-slot .icon{font-size:24px}
        .zombie-slot .name{margin-top:2px}
        .zombie-slot .cost{font-size:8px;color:#ffeb3b}
        .alternatives{display:flex;gap:6px;justify-content:center;margin-top:5px}
        .alt-card{width:65px;height:70px;border-radius:6px;border:2px solid #555;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;background:#333}
        .alt-card.selected{border-color:#ffeb3b}

        .zombie-btns{display:none;flex-wrap:wrap;gap:5px;justify-content:center}
        .zombie-btns.show{display:flex}
        .zombie-card{width:68px;height:82px;border-radius:8px;border:2px solid #555;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-align:center;background:#333}
        .zombie-card.locked{opacity:0.4;cursor:not-allowed}
        .zombie-card.selected{border-color:#fff;box-shadow:0 0 10px #fff}
        .btn{padding:8px 18px;border:none;border-radius:18px;font-weight:700;cursor:pointer;color:#fff;font-size:0.85em}
        .btn-next{background:#2196f3} .btn-restart{background:#ff9800;color:#000}
        .message{color:#ffeb3b;font-weight:700;text-align:center;min-height:20px}
    </style>
</head>
<body>
<div class="wrapper">
<h1>🌱 Растения <span>VS</span> Зомби 🧟</h1>
<div class="screen" id="modeScreen">
  <h3>Выберите режим:</h3>
  <button class="mode-btn endless" onclick="selectMode('endless')">🏰 Бесконечный бой</button>
  <button class="mode-btn versus" onclick="selectMode('versus')">⚔️ Соревновательный</button>
</div>
<div class="screen" id="customizeScreen">
  <h3>🌱 Ваши 5 растений:</h3>
  <div class="grid" id="plantGrid"></div>
  <h3>🧟 Ваши зомби (5 отсеков):</h3>
  <div class="zombie-slots" id="zombieSlots"></div>
  <div id="alternativesContainer" style="margin-top:8px;"></div>
  <button class="mode-btn start-btn" onclick="startGame()">⚔️ Начать!</button>
</div>
<canvas id="c" width="950" height="600"></canvas>
<div class="message" id="msg"></div>
<div class="panel">
  <span id="roleDisplay" class="role">Ожидание...</span>
  <span class="score" id="score">0:0</span>
  <span class="timer" id="timer"></span>
</div>
<div class="zombie-btns" id="zombieBtns"></div>
<div style="display:flex;gap:8px">
  <button class="btn btn-next" id="btnNext" style="display:none" onclick="nextRound()">▶ Далее</button>
  <button class="btn btn-restart" onclick="restart()">🔄 Рестарт</button>
</div>
</div>
<script>
const socket = io();
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let role, host, g={}, selPlant=null, selZombie=null;

const plantsData = { ... }; // как раньше
const zombiesData = { ... };

// Определяем категории альтернатив для каждого слота (индексы 1-4)
const slotAlternatives = {
  1: ['cone', 'door', 'double_cone'],          // конусный и подобные
  2: ['bucket', 'shooter', 'double_bucket'],    // ведёрный и подобные
  3: ['runner', 'healer', 'jumper'],            // особые
  4: ['gargantuar', 'king', 'giant']            // боссы
};

socket.on('role', r => { role=r; updateUI(); });
socket.on('isHost', h => { host=h; if(h) document.getElementById('modeScreen').classList.add('show'); });
socket.on('state', d => { g=d; updateUI(); });
socket.on('message', m => { document.getElementById('msg').textContent=m; });

function updateUI() {
  document.getElementById('score').textContent = (g.score1||0)+':'+(g.score2||0);
  if (g.phase==='customize'){
    document.getElementById('modeScreen').classList.remove('show');
    document.getElementById('customizeScreen').classList.add('show');
    renderCustomize();
  } else document.getElementById('customizeScreen').classList.remove('show');
  if (g.phase==='prep') document.getElementById('timer').textContent='Подготовка '+g.prepTimer+'с';
  else if (g.phase==='playing') document.getElementById('timer').textContent='⏱ '+Math.floor(g.elapsedTime/60)+':'+String(Math.floor(g.elapsedTime%60)).padStart(2,'0');
  else document.getElementById('timer').textContent='';
  document.getElementById('btnNext').style.display = (g.phase==='result' && g.mode==='versus' && g.round<3) ? 'inline-block':'none';
  document.getElementById('roleDisplay').textContent = role==='defender'?'🛡️ Защитник':'🧟 Атакующий';
  document.getElementById('roleDisplay').className = 'role '+(role==='defender'?'defender':'attacker');
  document.getElementById('zombieBtns').classList.toggle('show', role==='attacker' && g.phase==='playing');
  if (role==='attacker') renderZombieCards();
}

function getMyPlants(){ return g.round%2===0 ? (role==='defender'?g.player1Plants:g.player2Plants) : (role==='defender'?g.player2Plants:g.player1Plants); }
function getMyZombies(){ return g.round%2===0 ? (role==='attacker'?g.player2Zombies:g.player1Zombies) : (role==='attacker'?g.player1Zombies:g.player2Zombies); }

let selectedPlants = [];
let selectedZombiesSlots = ['basic','cone','bucket','runner','gargantuar']; // 5 элементов

function renderCustomize() {
  const pl = getMyPlants() || Object.keys(plantsData).slice(0,5);
  const zm = getMyZombies() || ['basic','cone','bucket','runner','gargantuar'];
  selectedPlants = [...pl];
  selectedZombiesSlots = [...zm];
  
  // растения
  document.getElementById('plantGrid').innerHTML = Object.keys(plantsData).map(t => {
    const sel = selectedPlants.includes(t);
    return `<div class="card ${sel?'selected':''}" onclick="togglePlant('${t}')"><span class="icon">${plantsData[t].i}</span>${plantsData[t].n}</div>`;
  }).join('');
  
  // слоты зомби
  renderZombieSlots();
}

function renderZombieSlots() {
  const slotsDiv = document.getElementById('zombieSlots');
  slotsDiv.innerHTML = selectedZombiesSlots.map((type, idx) => {
    const z = zombiesData[type] || {};
    const locked = idx === 0;
    return `<div class="zombie-slot ${locked?'locked':''}" onclick="${locked?'':'openSlot('+idx+')'}">
      <span class="icon">${z.i||'🧟'}</span>
      <span class="name">${z.n||type}</span>
      <span class="cost">⚡${z.cost||30}</span>
    </div>`;
  }).join('');
  // скрываем альтернативы
  document.getElementById('alternativesContainer').innerHTML = '';
}

window.openSlot = function(idx) {
  const current = selectedZombiesSlots[idx];
  const alts = slotAlternatives[idx] || [];
  const container = document.getElementById('alternativesContainer');
  container.innerHTML = alts.map(alt => {
    const z = zombiesData[alt] || {};
    const sel = alt === current;
    return `<div class="alt-card ${sel?'selected':''}" onclick="selectAlt(${idx},'${alt}')">
      <span class="icon">${z.i||'🧟'}</span>${z.n||alt}<br><small>⚡${z.cost||'?'}</small>
    </div>`;
  }).join('');
};

window.selectAlt = function(idx, type) {
  selectedZombiesSlots[idx] = type;
  socket.emit('setZombies', selectedZombiesSlots);
  renderZombieSlots();
  document.getElementById('alternativesContainer').innerHTML = '';
};

function togglePlant(type) {
  if (selectedPlants.includes(type)) {
    if (selectedPlants.length > 1) selectedPlants = selectedPlants.filter(t => t !== type);
  } else if (selectedPlants.length < 5) {
    selectedPlants.push(type);
  }
  socket.emit('setPlants', selectedPlants);
  renderCustomize();
}

function selectMode(m) { socket.emit('selectMode', m); document.getElementById('modeScreen').classList.remove('show'); }
function startGame() { socket.emit('startGame'); }
function nextRound() { socket.emit('nextRound'); }
function restart() { socket.emit('restart'); document.getElementById('modeScreen').classList.add('show'); }

function renderZombieCards() { ... } // как раньше, но использует getMyZombies()
// ... остальная часть (canvas, draw) без изменений
</script>
</body>
</html>
