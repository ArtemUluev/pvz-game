<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PvZ v3.2</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Segoe UI,Arial;touch-action:manipulation;user-select:none}
.wrapper{display:flex;flex-direction:column;align-items:center;gap:6px;padding:5px;width:100%;max-width:960px}
canvas{width:100%;max-width:950px;border:2px solid #333;border-radius:10px;cursor:crosshair;background:#000}
.panel{display:flex;gap:8px;background:#16213e;padding:6px 14px;border-radius:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.role{padding:5px 12px;border-radius:14px;font-weight:700;font-size:13px}
.defender{background:rgba(76,175,80,0.3);color:#a5d6a7;border:1px solid #4caf50}
.attacker{background:rgba(255,87,34,0.3);color:#ffab91;border:1px solid #ff5722}
.score{color:#fff;font-size:1.2em;font-weight:900}
.timer{color:#ffeb3b}
.zombie-btns{display:none;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:4px}
.zombie-btns.show{display:flex}
.zombie-card{width:68px;height:82px;border-radius:8px;border:2px solid #555;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-align:center;background:#333}
.zombie-card .icon{font-size:22px}
.btn-restart{background:#ff9800;color:#000;padding:8px 18px;border:none;border-radius:18px;font-weight:700;cursor:pointer}
.tools{display:flex;gap:6px;margin-top:4px;justify-content:center}
.tool-btn{width:68px;height:50px;border-radius:6px;border:2px solid #555;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;background:#333;color:#fff}
.tool-btn.active{background:#fff9c4;border-color:#ff9800}
</style>
</head>
<body>
<div class="wrapper">
<canvas id="c" width="950" height="600"></canvas>
<div class="panel">
  <span id="roleDisplay" class="role">Ожидание...</span>
  <span class="score" id="score">0:0</span>
  <span class="timer" id="timer"></span>
</div>
<div class="zombie-btns" id="zombieBtns">
  <div class="zombie-card" onclick="spawnZombie('basic',-1)"><span class="icon">🧟</span>Обычный<br>⚡30</div>
  <div class="zombie-card" onclick="spawnZombie('cone',-1)"><span class="icon">🪖</span>Конус<br>⚡50</div>
  <div class="zombie-card" onclick="spawnZombie('bucket',-1)"><span class="icon">🪣</span>Ведро<br>⚡80</div>
  <div class="zombie-card" onclick="spawnZombie('runner',-1)"><span class="icon">🏃</span>Бегун<br>⚡40</div>
  <div class="zombie-card" onclick="spawnZombie('gargantuar',-1)"><span class="icon">👹</span>Гаргантюа<br>⚡150</div>
</div>
<div class="tools" id="tools">
  <div class="tool-btn" id="shovelBtn" onclick="toggleShovel()" title="Лопата (удалить растение)">🔧</div>
</div>
<button class="btn-restart" onclick="location.reload()">🔄 Рестарт</button>
</div>
<script>
const socket = io();
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let role = '', g = {}, selPlant = null, shovelMode = false;

socket.on('role', r => {
  role = r;
  document.getElementById('roleDisplay').textContent = role === 'defender' ? '🛡️ Защитник' : '🧟 Атакующий';
  document.getElementById('roleDisplay').className = 'role ' + (role === 'defender' ? 'defender' : 'attacker');
  document.getElementById('zombieBtns').classList.toggle('show', role === 'attacker');
  document.getElementById('tools').style.display = role === 'defender' ? 'flex' : 'none';
});

socket.on('state', d => {
  g = d;
  document.getElementById('score').textContent = `${d.score1} : ${d.score2}`;
  if (d.spawnLocked) {
    document.getElementById('timer').textContent = `Подготовка ${d.prepTimer}с`;
  } else {
    document.getElementById('timer').textContent = '';
  }
});

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * 950 / rect.width;
  const y = (e.clientY - rect.top) * 600 / rect.height;

  if (role === 'defender' && !g.spawnLocked) {
    // лопата
    if (shovelMode) {
      const col = Math.floor((x - 150) / 85), row = Math.floor((y - 120) / 90);
      if (col >= 0 && col < 9 && row >= 0 && row < 5) {
        socket.emit('shovel', { row, col });
        shovelMode = false;
        updateShovelButton();
      }
      return;
    }

    // солнце
    if (g.sunDrops) for (let i = 0; i < g.sunDrops.length; i++) {
      const s = g.sunDrops[i];
      if (s.alive === false) continue;
      if (Math.hypot(x - s.x, y - s.y) < 22) { socket.emit('collect', { id: i }); return; }
    }

    // выбор растения
    const plants = ['sunflower','peashooter','snowpea','walnut','cherrybomb'];
    const costs = { sunflower:50, peashooter:100, snowpea:175, walnut:50, cherrybomb:150 };
    if (y < 80) {
      for (let i = 0; i < 5; i++) {
        const bx = 10 + i * 110;
        if (x >= bx && x <= bx + 100 && g.sunPoints >= costs[plants[i]]) {
          selPlant = selPlant === plants[i] ? null : plants[i];
          return;
        }
      }
    }

    // посадка
    if (selPlant && y > 120) {
      const col = Math.floor((x - 150) / 85), row = Math.floor((y - 120) / 90);
      if (col >= 0 && col < 9 && row >= 0 && row < 5) socket.emit('plant', { type: selPlant, row, col });
    }
  }
});

function toggleShovel() {
  shovelMode = !shovelMode;
  selPlant = null;
  updateShovelButton();
}

function updateShovelButton() {
  const btn = document.getElementById('shovelBtn');
  if (shovelMode) {
    btn.classList.add('active');
    btn.textContent = '🔧✓';
  } else {
    btn.classList.remove('active');
    btn.textContent = '🔧';
  }
}

function spawnZombie(type, row) {
  if (role !== 'attacker' || g.spawnLocked) return;
  const r = row >= 0 ? row : Math.floor(Math.random() * 5);
  socket.emit('zombie', { type, row: r });
}

function draw() {
  ctx.clearRect(0, 0, 950, 600);
  if (!g.plants) { ctx.fillStyle = '#fff'; ctx.fillText('Ожидание...', 400, 300); return; }

  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 9; c++) {
      ctx.fillStyle = (r + c) % 2 ? '#8bc34a' : '#7cb342';
      ctx.fillRect(150 + c * 85, 120 + r * 90, 83, 88);
    }
  }

  if (g.lawnmowers) g.lawnmowers.forEach((active, row) => {
    if (active) { ctx.fillStyle = '#c62828'; ctx.fillRect(115, 145 + row * 90, 30, 15); }
  });

  if (role === 'defender') {
    ctx.fillStyle = '#1b5e20'; ctx.fillRect(0, 0, 950, 80);
    const plants = ['sunflower','peashooter','snowpea','walnut','cherrybomb'];
    const costs = { sunflower:50, peashooter:100, snowpea:175, walnut:50, cherrybomb:150 };
    plants.forEach((t, i) => {
      const x = 10 + i * 110;
      const can = g.sunPoints >= costs[t], cd = (g.plantCooldowns?.[t] || 0) > 0;
      ctx.fillStyle = selPlant === t ? '#fff9c4' : (cd ? '#555' : (can ? '#c8e6c9' : '#666'));
      ctx.fillRect(x, 10, 100, 60);
      ctx.fillStyle = '#fff'; ctx.font = '10px Arial'; ctx.fillText(t, x + 50, 45);
      ctx.fillText(cd ? '⏳' + Math.ceil(g.plantCooldowns[t]) + 'с' : '☀' + costs[t], x + 50, 65);
    });
    if (shovelMode) {
      ctx.fillStyle = '#fff9c4'; ctx.font = '14px Arial';
      ctx.fillText('🔧 лопата активна', 580, 50);
    }
  }

  if (g.sunDrops) g.sunDrops.forEach(s => {
    if (s.alive === false) return;
    ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(s.x, s.y, 10, 0, Math.PI*2); ctx.fill();
  });

  if (g.plants) g.plants.forEach(p => {
    const colors = { sunflower:'#ffeb3b', peashooter:'#4caf50', snowpea:'#81d4fa', walnut:'#8d6e63', cherrybomb:'#f44336' };
    ctx.fillStyle = colors[p.type] || '#888'; ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI*2); ctx.fill();
  });

  if (g.zombies) g.zombies.forEach(z => {
    const colors = { basic:'#9ccc65', cone:'#ff9800', bucket:'#795548', runner:'#f44336', gargantuar:'#9c27b0' };
    ctx.fillStyle = colors[z.type] || '#9ccc65'; ctx.fillRect(z.x - 10, z.y - 15, 20, 30);
    if (z.type === 'gargantuar') {
      ctx.fillStyle = '#fff'; ctx.font = '12px Arial'; ctx.fillText('👹', z.x - 8, z.y - 10);
    }
  });

  if (g.projectiles) g.projectiles.forEach(p => {
    ctx.fillStyle = '#a5d6a7'; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill();
  });

  if (g.gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, 950, 600);
    ctx.fillStyle = '#fff'; ctx.font = '28px Arial';
    ctx.fillText(g.winner === 'defender' ? '🌱 Защитник выстоял!' : '🧟 Зомби прорвались!', 300, 300);
  }

  if (g.hordeTimer && g.elapsedTime > 30) {
    ctx.fillStyle = '#aaa'; ctx.font = '12px Arial';
    ctx.fillText('Орда: ' + Math.ceil(g.hordeTimer) + 'с', 800, 20);
  }
}

function loop() { draw(); requestAnimationFrame(loop); } loop();
</script>
</body>
</html>
