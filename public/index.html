<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PvZ v4.0</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Segoe UI,Arial;touch-action:manipulation;user-select:none}
.wrapper{display:flex;flex-direction:column;align-items:center;gap:6px;padding:5px;width:100%;max-width:960px}
h1{color:#fff;font-size:1.4em;text-align:center} h1 span{color:#ff5722}
canvas{width:100%;max-width:950px;border:2px solid #333;border-radius:10px;cursor:crosshair;background:#000}
.panel{display:flex;gap:8px;background:#16213e;padding:6px 14px;border-radius:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.role{padding:5px 12px;border-radius:14px;font-weight:700;font-size:13px}
.defender{background:rgba(76,175,80,0.3);color:#a5d6a7;border:1px solid #4caf50}
.attacker{background:rgba(255,87,34,0.3);color:#ffab91;border:1px solid #ff5722}
.score{color:#fff;font-size:1.2em;font-weight:900}
.timer{color:#ffeb3b;font-weight:700}
.screen{display:none;flex-direction:column;gap:12px;align-items:center;padding:18px;background:#16213e;border-radius:12px;color:#fff;width:100%;max-width:900px}
.screen.show{display:flex}
.mode-btn{padding:10px 20px;border:none;border-radius:8px;font-weight:700;cursor:pointer;color:#fff;width:220px}
.endless{background:#4caf50} .versus{background:#ff5722} .start-btn{background:#2196f3;width:200px}
.grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.card{width:70px;height:80px;border-radius:8px;border:2px solid #555;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-align:center;background:#333}
.card.selected{border-color:#ffeb3b;box-shadow:0 0 8px #ffeb3b;background:#4a4a2e}
.card .icon{font-size:22px}
.zombie-btns{display:none;flex-wrap:wrap;gap:5px;justify-content:center}
.zombie-btns.show{display:flex}
.zombie-card{width:68px;height:82px;border-radius:8px;border:2px solid #555;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-align:center;background:#333}
.zombie-card.locked{opacity:0.4;cursor:not-allowed}
.zombie-card.selected{border-color:#fff;box-shadow:0 0 10px #fff}
.zombie-card .icon{font-size:22px}
.btn{padding:8px 18px;border:none;border-radius:18px;font-weight:700;cursor:pointer;color:#fff;font-size:0.85em}
.btn-next{background:#2196f3} .btn-restart{background:#ff9800;color:#000}
.message{color:#ffeb3b;font-weight:700;text-align:center;min-height:20px}
</style>
</head>
<body>
<div class="wrapper">
<h1>🌱 Растения <span>VS</span> Зомби 🧟</h1>
<div class="screen" id="modeScreen">
  <h3>Выберите режим:</h3>
  <button class="mode-btn endless" onclick="selectMode('endless')">🏰 Бесконечный бой</button>
  <button class="mode-btn versus" onclick="selectMode('versus')">⚔️ Соревновательный</button>
</div>
<div class="screen" id="customizeScreen">
  <h3>🌱 Ваши 5 растений:</h3>
  <div class="grid" id="plantGrid"></div>
  <h3>🧟 Ваши 5 зомби:</h3>
  <div class="grid" id="zombieGrid"></div>
  <button class="mode-btn start-btn" onclick="startGame()">⚔️ Начать!</button>
</div>
<canvas id="c" width="950" height="600"></canvas>
<div class="message" id="msg"></div>
<div class="panel">
  <span id="roleDisplay" class="role">Ожидание...</span>
  <span class="score" id="score">0:0</span>
  <span class="timer" id="timer"></span>
</div>
<div class="zombie-btns" id="zombieBtns"></div>
<div style="display:flex;gap:8px">
  <button class="btn btn-next" id="btnNext" style="display:none" onclick="nextRound()">▶ Далее</button>
  <button class="btn btn-restart" onclick="restart()">🔄 Рестарт</button>
</div>
</div>
<script>
const socket = io();
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let role, host, g={}, selPlant=null, selZombie=null;
const plantsData = {
  sunflower:{n:'Подсолнух',i:'🌻',c:50,cl:'#ffeb3b'},peashooter:{n:'Горох',i:'🔫',c:100,cl:'#4caf50'},
  snowpea:{n:'Ледяной',i:'❄️',c:175,cl:'#81d4fa'},walnut:{n:'Орех',i:'🛡️',c:50,cl:'#8d6e63'},
  cherrybomb:{n:'Бомба',i:'💣',c:150,cl:'#f44336'},repeater:{n:'Повторюха',i:'🔁',c:200,cl:'#4caf50'},
  torchwood:{n:'Факел',i:'🔥',c:175,cl:'#ff9800'},potatomine:{n:'Мина',i:'🥔',c:25,cl:'#8d6e63'},
  chomper:{n:'Венерина',i:'🪴',c:150,cl:'#9c27b0'},starfruit:{n:'Звездоплод',i:'⭐',c:125,cl:'#ffeb3b'},
  garlic:{n:'Чеснок',i:'🧄',c:50,cl:'#e0e0e0'},cattail:{n:'Рогоз',i:'🎯',c:225,cl:'#81d4fa'}
};
const zombiesData = {
  basic:{n:'Обычный',i:'🧟',t:0,cost:30,cl:'#9ccc65'},cone:{n:'Конус',i:'🪖',t:1,cost:50,cl:'#ff9800'},
  bucket:{n:'Ведро',i:'🪣',t:2,cost:80,cl:'#795548'},runner:{n:'Бегун',i:'🏃',t:3,cost:40,cl:'#f44336'},
  gargantuar:{n:'Гаргантюа',i:'👹',t:4,cost:150,cl:'#9c27b0'},imp:{n:'Чертёнок',i:'👿',t:0,cost:20,cl:'#e53935'},
  triple_basic:{n:'Трио',i:'🧟🧟🧟',t:0,cost:55,cl:'#9ccc65'},door:{n:'Дверь',i:'🚪',t:1,cost:60,cl:'#8d6e63'},
  double_cone:{n:'2 конуса',i:'🪖🪖',t:1,cost:70,cl:'#ff9800'},shooter:{n:'Стрелок',i:'🔫',t:2,cost:90,cl:'#607d8b'},
  double_bucket:{n:'2 ведра',i:'🪣🪣',t:2,cost:100,cl:'#795548'},healer:{n:'Доктор',i:'💉',t:3,cost:55,cl:'#e0e0e0'},
  jumper:{n:'Прыгун',i:'🦘',t:3,cost:45,cl:'#ff5722'},king:{n:'Король',i:'👑',t:4,cost:180,cl:'#ffd700'},
  giant:{n:'Гигант',i:'🗿',t:4,cost:160,cl:'#607d8b'}
};
socket.on('role', r => { role=r; updateUI(); });
socket.on('isHost', h => { host=h; if(h) document.getElementById('modeScreen').classList.add('show'); });
socket.on('state', d => { g=d; updateUI(); });
socket.on('message', m => { document.getElementById('msg').textContent=m; });
function updateUI() {
  document.getElementById('score').textContent = (g.score1||0)+':'+(g.score2||0);
  if (g.phase==='customize'){
    document.getElementById('modeScreen').classList.remove('show');
    document.getElementById('customizeScreen').classList.add('show');
    renderCustomize();
  } else document.getElementById('customizeScreen').classList.remove('show');
  if (g.phase==='prep') document.getElementById('timer').textContent='Подготовка '+g.prepTimer+'с';
  else if (g.phase==='playing') document.getElementById('timer').textContent='⏱ '+Math.floor(g.elapsedTime/60)+':'+String(Math.floor(g.elapsedTime%60)).padStart(2,'0');
  else document.getElementById('timer').textContent='';
  document.getElementById('btnNext').style.display = (g.phase==='result' && g.mode==='versus' && g.round<3) ? 'inline-block':'none';
  document.getElementById('roleDisplay').textContent = role==='defender'?'🛡️ Защитник':'🧟 Атакующий';
  document.getElementById('roleDisplay').className = 'role '+(role==='defender'?'defender':'attacker');
  document.getElementById('zombieBtns').classList.toggle('show', role==='attacker' && g.phase==='playing');
  if (role==='attacker') renderZombieCards();
}
function getMyPlants(){ return g.round%2===0 ? (role==='defender'?g.player1Plants:g.player2Plants) : (role==='defender'?g.player2Plants:g.player1Plants); }
function getMyZombies(){ return g.round%2===0 ? (role==='attacker'?g.player2Zombies:g.player1Zombies) : (role==='attacker'?g.player1Zombies:g.player2Zombies); }
let selPlants=[], selZombies=[];
function renderCustomize(){
  const pl = getMyPlants()||Object.keys(plantsData).slice(0,5);
  const zm = getMyZombies()||Object.keys(zombiesData).slice(0,5);
  selPlants=[...pl]; selZombies=[...zm];
  document.getElementById('plantGrid').innerHTML = Object.keys(plantsData).map(t=>`<div class="card ${pl.includes(t)?'selected':''}" onclick="toggleP('${t}')"><span class="icon">${plantsData[t].i}</span>${plantsData[t].n}</div>`).join('');
  document.getElementById('zombieGrid').innerHTML = Object.keys(zombiesData).map(t=>`<div class="card ${zm.includes(t)?'selected':''}" onclick="toggleZ('${t}')"><span class="icon">${zombiesData[t].i}</span>${zombiesData[t].n}</div>`).join('');
}
function toggleP(t){ if(selPlants.includes(t)){ if(selPlants.length>1) selPlants=selPlants.filter(x=>x!==t); } else if(selPlants.length<5) selPlants.push(t); socket.emit('setPlants',selPlants); renderCustomize(); }
function toggleZ(t){ if(selZombies.includes(t)){ if(selZombies.length>1) selZombies=selZombies.filter(x=>x!==t); } else if(selZombies.length<5) selZombies.push(t); socket.emit('setZombies',selZombies); renderCustomize(); }
function selectMode(m){ socket.emit('selectMode',m); document.getElementById('modeScreen').classList.remove('show'); }
function startGame(){ socket.emit('startGame'); }
function nextRound(){ socket.emit('nextRound'); }
function restart(){ socket.emit('restart'); document.getElementById('modeScreen').classList.add('show'); }
function renderZombieCards(){
  const list = getMyZombies()||[];
  document.getElementById('zombieBtns').innerHTML = list.map(t=>{
    const z=zombiesData[t]||{};
    return `<div class="zombie-card ${(z.t||0)>(g.unlockedTiers||0)?'locked':''} ${selZombie===t?'selected':''}" onclick="pickZ('${t}')"><span class="icon">${z.i||'🧟'}</span>${z.n||t}<br><small>⚡${z.cost||30}</small></div>`;
  }).join('');
}
function pickZ(t){ if((zombiesData[t]?.t||0)>(g.unlockedTiers||0)) return; selZombie=selZombie===t?null:t; renderZombieCards(); }
canvas.addEventListener('click', e => {
  const r=canvas.getBoundingClientRect(), x=(e.clientX-r.left)*950/r.width, y=(e.clientY-r.top)*600/r.height;
  if (role==='defender' && g.phase==='playing'){
    if (g.sunDrops) for (let i=0;i<g.sunDrops.length;i++){ const s=g.sunDrops[i]; if (s.alive===false) continue; if (Math.hypot(x-s.x,y-s.y)<22){ socket.emit('collect',{id:i}); return; } }
    if (y<80){
      const list=getMyPlants();
      for (let i=0;i<list.length;i++){ const bx=10+i*110; if (x>=bx && x<=bx+100){ const t=list[i]; const p=plantsData[t]; if ((g.sunPoints||0)>=p.c && !(g.plantCooldowns?.[t]>0)) selPlant=selPlant===t?null:t; return; } }
    }
    if (selPlant && y>120){ const col=Math.floor((x-150)/85), row=Math.floor((y-120)/90); if (col>=0&&col<9&&row>=0&&row<5) socket.emit('plant',{type:selPlant,row,col}); }
  }
  if (role==='attacker' && g.phase==='playing' && !g.spawnLocked && selZombie && y>120){
    const row=Math.floor((y-120)/90); if (row>=0&&row<5) socket.emit('zombie',{type:selZombie,row});
  }
});
document.addEventListener('keydown', e => {
  if (role!=='attacker' || g.spawnLocked || g.phase!=='playing') return;
  const list=getMyZombies(), k=e.key.toLowerCase();
  if (k>='1'&&k<='5'){ const t=list[parseInt(k)-1]; if(t){ socket.emit('zombie',{type:t,row:parseInt(k)-1}); selZombie=t; } }
});
function draw(){
  ctx.clearRect(0,0,950,600);
  if (!g.plants){ ctx.fillStyle='#fff';ctx.font='18px Arial';ctx.fillText('Ожидание...',400,300); return; }
  for (let r=0;r<5;r++) for (let c=0;c<9;c++){ ctx.fillStyle=(r+c)%2?'#8bc34a':'#7cb342'; ctx.fillRect(150+c*85,120+r*90,83,88); }
  if (g.lawnmowers) g.lawnmowers.forEach((a,i)=>{ if(a){ ctx.fillStyle='#c62828'; ctx.fillRect(115,145+i*90,30,15); } });
  if (role==='defender' && g.phase==='playing'){
    ctx.fillStyle='#1b5e20'; ctx.fillRect(0,0,950,80);
    const list=getMyPlants();
    list.forEach((t,i)=>{
      const p=plantsData[t]||{}, x=10+i*110, can=(g.sunPoints||0)>=(p.c||0), cd=(g.plantCooldowns?.[t]||0)>0;
      ctx.fillStyle=selPlant===t?'#fff9c4':(cd?'#555':(can?'#c8e6c9':'#666')); ctx.fillRect(x,10,100,60);
      ctx.fillStyle=cd?'#888':p.cl; ctx.beginPath(); ctx.arc(x+50,28,14,0,6.28); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='10px Arial'; ctx.textAlign='center';
      ctx.fillText(p.n||t,x+50,50); ctx.fillText(cd?'⏳'+Math.ceil(g.plantCooldowns[t])+'с':'☀'+p.c,x+50,65);
    });
    ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.font='bold 16px Arial';
    ctx.fillText('☀ '+(g.sunPoints||0),580,45);
    ctx.fillText(selPlant?plantsData[selPlant]?.n||selPlant:'Нет',580,65);
  }
  if (role==='attacker' && g.phase==='playing'){
    ctx.fillStyle='#4a148c'; ctx.fillRect(0,0,950,80);
    ctx.fillStyle='#fff'; ctx.font='bold 16px Arial';
    ctx.fillText('⚡ '+(g.zombieEnergy||0)+'/'+(g.maxEnergy||300),15,35);
    ctx.fillText(selZombie?zombiesData[selZombie]?.n||selZombie:'Выберите',15,60);
  }
  if (g.sunDrops) g.sunDrops.forEach(s=>{ if(s.alive===false) return; ctx.fillStyle='#ffeb3b'; ctx.beginPath(); ctx.arc(s.x,s.y,12,0,6.28); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='12px Arial'; ctx.textAlign='center'; ctx.fillText('☀',s.x,s.y+4); ctx.textAlign='left'; });
  if (g.plants) g.plants.forEach(p=>{ ctx.fillStyle=plantsData[p.type]?.cl||'#888'; ctx.beginPath(); ctx.arc(p.x,p.y,18,0,6.28); ctx.fill(); });
  if (g.zombies) g.zombies.forEach(z=>{ ctx.fillStyle=zombiesData[z.type]?.cl||'#9ccc65'; ctx.fillRect(z.x-10,z.y-15,20,30); if(z.doorHp>0){ ctx.fillStyle='#8d6e63'; ctx.fillRect(z.x-12,z.y-20,24,8); } ctx.fillStyle='#c8e6c9'; ctx.beginPath(); ctx.arc(z.x,z.y-18,10,0,6.28); ctx.fill(); });
  if (g.projectiles) g.projectiles.forEach(p=>{ ctx.fillStyle=p.fire?'#ff9800':p.homing?'#ff4081':'#a5d6a7'; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,6.28); ctx.fill(); });
  if (g.gameOver){ ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,950,600); ctx.fillStyle='#fff'; ctx.font='28px Arial'; ctx.textAlign='center'; ctx.fillText(g.winner==='defender'?'🌱 Победа защитника!':'🧟 Зомби прорвались!',475,280); }
}
function loop(){ draw(); requestAnimationFrame(loop); } loop();
</script>
</body>
</html>
