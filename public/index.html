<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PvZ Мультиплеер v4.0</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#1a1a2e;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            font-family:'Segoe UI',Arial,sans-serif;
            touch-action:manipulation;user-select:none;
        }
        .wrapper{
            display:flex;flex-direction:column;align-items:center;gap:8px;
            padding:5px;width:100%;max-width:960px;
        }
        h1{color:#fff;font-size:clamp(1.2em,4vw,1.8em);text-align:center}
        h1 span{color:#ff5722}
        canvas{width:100%;max-width:950px;border:2px solid #333;border-radius:10px;cursor:crosshair;background:#000}
        .panel{
            display:flex;gap:8px;background:#16213e;padding:6px 14px;
            border-radius:8px;align-items:center;flex-wrap:wrap;justify-content:center;
        }
        .role{padding:5px 12px;border-radius:14px;font-weight:700;font-size:13px}
        .defender{background:rgba(76,175,80,0.3);color:#a5d6a7;border:1px solid #4caf50}
        .attacker{background:rgba(255,87,34,0.3);color:#ffab91;border:1px solid #ff5722}
        .score{color:#fff;font-size:1.2em;font-weight:900}
        .timer{color:#ffeb3b;font-weight:700;font-size:1em}
        .info-row{display:flex;gap:15px;color:#aaa;font-size:0.8em;flex-wrap:wrap;justify-content:center}
        
        .mode-select, .customize-screen{
            display:none;flex-direction:column;gap:12px;align-items:center;
            padding:18px;background:#16213e;border-radius:12px;color:#fff;
            width:100%;max-width:900px;
        }
        .mode-select.show, .customize-screen.show{display:flex}
        .mode-btn{padding:10px 20px;border:none;border-radius:8px;font-weight:700;font-size:0.95em;cursor:pointer;color:#fff;width:220px}
        .mode-endless{background:#4caf50}
        .mode-versus{background:#ff5722}
        .start-btn{background:#2196f3;width:200px}
        
        .selection-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
        .select-card{
            width:70px;height:80px;border-radius:8px;border:2px solid #555;
            cursor:pointer;display:flex;flex-direction:column;align-items:center;
            justify-content:center;font-size:9px;font-weight:700;color:#fff;
            text-align:center;background:#333;transition:0.1s;
        }
        .select-card.selected{border-color:#ffeb3b;box-shadow:0 0 8px #ffeb3b;background:#4a4a2e}
        .select-card .icon{font-size:22px}
        
        .zombie-btns{display:none;flex-wrap:wrap;gap:5px;justify-content:center}
        .zombie-btns.show{display:flex}
        .zombie-card{
            width:68px;height:82px;border-radius:8px;border:2px solid #555;
            cursor:pointer;display:flex;flex-direction:column;align-items:center;
            justify-content:center;font-size:9px;font-weight:700;color:#fff;
            position:relative;text-align:center;
        }
        .zombie-card.locked{opacity:0.4;cursor:not-allowed}
        .zombie-card.selected{border-color:#fff;box-shadow:0 0 10px #fff}
        .zombie-card .zombie-icon{font-size:22px;margin-bottom:2px}
        .zombie-card .zombie-cost{font-size:8px;color:#ffeb3b}
        
        .btn{padding:8px 18px;border:none;border-radius:18px;font-weight:700;cursor:pointer;color:#fff;font-size:0.85em}
        .btn-next{background:#2196f3}
        .btn-restart{background:#ff9800;color:#000}
        .message{color:#ffeb3b;font-weight:700;text-align:center;min-height:20px;font-size:0.9em}
        kbd{background:#333;padding:1px 5px;border-radius:3px;color:#fff}
    </style>
</head>
<body>
<div class="wrapper">
    <h1>🌱 Растения <span>VS</span> Зомби 🧟</h1>
    
    <div class="mode-select" id="modeSelect">
        <h3>Выберите режим:</h3>
        <button class="mode-btn mode-endless" onclick="selectMode('endless')">🏰 Бесконечный бой</button>
        <button class="mode-btn mode-versus" onclick="selectMode('versus')">⚔️ Соревновательный</button>
    </div>
    
    <div class="customize-screen" id="customizeScreen">
        <h3>🌱 Выберите 5 растений:</h3>
        <div class="selection-grid" id="plantGrid"></div>
        <h3>🧟 Выберите 5 зомби:</h3>
        <div class="selection-grid" id="zombieGrid"></div>
        <button class="mode-btn start-btn" onclick="startGame()">⚔️ Начать игру!</button>
    </div>
    
    <canvas id="game" width="950" height="600"></canvas>
    
    <div class="message" id="message"></div>
    
    <div class="panel">
        <span id="roleDisplay" class="role">Ожидание...</span>
        <span class="score" id="scoreDisplay">0 : 0</span>
        <span class="timer" id="timerDisplay"></span>
    </div>
    
    <div class="info-row">
        <span id="tierInfo"></span>
        <span id="hordeInfo"></span>
    </div>
    
    <div class="zombie-btns" id="zombieBtns"></div>
    
    <div style="display:flex;gap:8px;">
        <button class="btn btn-next" id="btnNext" style="display:none;" onclick="nextRound()">▶ Следующий раунд</button>
        <button class="btn btn-restart" onclick="restartGame()">🔄 Рестарт</button>
    </div>
</div>

<script>
const socket = io();
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let myRole = null, isHost = false, gameData = {};
let selectedPlant = null, selectedZombie = null;
let unlockedTypes = [];

// Все растения (12)
const ALL_PLANTS = {
    sunflower: { name:'Подсолнух', icon:'🌻', cost:50, color:'#ffeb3b' },
    peashooter: { name:'Горохострел', icon:'🔫', cost:100, color:'#4caf50' },
    snowpea: { name:'Ледяной горох', icon:'❄️', cost:175, color:'#81d4fa' },
    walnut: { name:'Орех', icon:'🛡️', cost:50, color:'#8d6e63' },
    cherrybomb: { name:'Вишня-бомба', icon:'💣', cost:150, color:'#f44336' },
    repeater: { name:'Повторюха', icon:'🔁', cost:200, color:'#4caf50' },
    torchwood: { name:'Факел', icon:'🔥', cost:175, color:'#ff9800' },
    potatomine: { name:'Картофель-мина', icon:'🥔', cost:25, color:'#8d6e63' },
    chomper: { name:'Венерина', icon:'🪴', cost:150, color:'#9c27b0' },
    starfruit: { name:'Звездоплод', icon:'⭐', cost:125, color:'#ffeb3b' },
    garlic: { name:'Чеснок', icon:'🧄', cost:50, color:'#e0e0e0' },
    cattail: { name:'Рогоз', icon:'🎯', cost:225, color:'#81d4fa' }
};

// Все зомби (базовые + альтернативные)
const ALL_ZOMBIES = {
    basic: { name:'Обычный', icon:'🧟', tier:0, cost:30, color:'#9ccc65' },
    cone: { name:'Конусный', icon:'🪖', tier:1, cost:50, color:'#ff9800' },
    bucket: { name:'Ведёрный', icon:'🪣', tier:2, cost:80, color:'#795548' },
    runner: { name:'Бегун', icon:'🏃', tier:3, cost:40, color:'#f44336' },
    gargantuar: { name:'Гаргантюа', icon:'👹', tier:4, cost:150, color:'#9c27b0' },
    imp: { name:'Чертёнок', icon:'👿', tier:0, cost:20, color:'#e53935' },
    triple_basic: { name:'Трио обычных', icon:'🧟🧟🧟', tier:0, cost:55, color:'#9ccc65' },
    door: { name:'С дверью', icon:'🚪', tier:1, cost:60, color:'#8d6e63' },
    double_cone: { name:'Два конусных', icon:'🪖🪖', tier:1, cost:70, color:'#ff9800' },
    shooter: { name:'Стрелок', icon:'🔫', tier:2, cost:90, color:'#607d8b' },
    double_bucket: { name:'Два ведёрных', icon:'🪣🪣', tier:2, cost:100, color:'#795548' },
    healer: { name:'Доктор', icon:'💉', tier:3, cost:55, color:'#e0e0e0' },
    jumper: { name:'Прыгун', icon:'🦘', tier:3, cost:45, color:'#ff5722' },
    king: { name:'Король', icon:'👑', tier:4, cost:180, color:'#ffd700' },
    giant: { name:'Гигант', icon:'🗿', tier:4, cost:160, color:'#607d8b' }
};

socket.on('role', (role) => { myRole = role; updateRoleDisplay(); });
socket.on('isHost', (host) => {
    isHost = host;
    if (isHost && gameData.phase === 'lobby') document.getElementById('modeSelect').classList.add('show');
});
socket.on('state', (data) => {
    gameData = data;
    updateUI();
});
socket.on('message', (msg) => {
    document.getElementById('message').textContent = msg;
    setTimeout(() => {
        if (document.getElementById('message').textContent === msg)
            document.getElementById('message').textContent = '';
    }, 4000);
});
socket.on('unlockedZombies', (types) => { unlockedTypes = types; updateZombieCards(); });

function updateRoleDisplay() {
    const el = document.getElementById('roleDisplay');
    if (myRole === 'defender') {
        el.textContent = '🛡️ Защитник';
        el.className = 'role defender';
        document.getElementById('zombieBtns').classList.remove('show');
    } else {
        el.textContent = '🧟 Атакующий';
        el.className = 'role attacker';
        document.getElementById('zombieBtns').classList.add('show');
    }
}

function getMyPlants() {
    if (!gameData.player1Plants || !gameData.player2Plants) return Object.keys(ALL_PLANTS).slice(0,5);
    return myRole === 'defender' ? 
        (gameData.round % 2 === 0 ? gameData.player1Plants : gameData.player2Plants) :
        (gameData.round % 2 === 0 ? gameData.player2Plants : gameData.player1Plants);
}

function getMyZombies() {
    if (!gameData.player1Zombies || !gameData.player2Zombies) return Object.keys(ALL_ZOMBIES).slice(0,5);
    return myRole === 'attacker' ? 
        (gameData.round % 2 === 0 ? gameData.player2Zombies : gameData.player1Zombies) :
        (gameData.round % 2 === 0 ? gameData.player1Zombies : gameData.player2Zombies);
}

function updateUI() {
    document.getElementById('scoreDisplay').textContent = `${gameData.score1||0} : ${gameData.score2||0}`;
    
    if (gameData.phase === 'customize') {
        document.getElementById('modeSelect').classList.remove('show');
        document.getElementById('customizeScreen').classList.add('show');
        renderCustomizeScreen();
    } else {
        document.getElementById('customizeScreen').classList.remove('show');
    }
    
    if (gameData.phase === 'prep') {
        document.getElementById('timerDisplay').textContent = `Подготовка: ${gameData.prepTimer}с`;
    } else if (gameData.phase === 'playing') {
        const m = Math.floor((gameData.elapsedTime||0)/60);
        const s = Math.floor((gameData.elapsedTime||0)%60);
        document.getElementById('timerDisplay').textContent = `⏱ ${m}:${String(s).padStart(2,'0')}`;
    } else {
        document.getElementById('timerDisplay').textContent = '';
    }
    
    document.getElementById('tierInfo').textContent = 
        `Тир: ${(gameData.unlockedTiers||0)+1}/5 | Убито: ${gameData.zombieKillCount||0}`;
    document.getElementById('hordeInfo').textContent = 
        `Орда через ${Math.ceil(gameData.hordeTimer||0)}с`;
    
    document.getElementById('btnNext').style.display = 
        (gameData.phase==='result' && gameData.mode==='versus' && gameData.round<3) ? 'inline-block' : 'none';
    
    if (gameData.phase === 'gameover' && gameData.mode === 'versus') {
        document.getElementById('message').textContent = 
            `Матч окончен! Победы: ${(gameData.roundsWon||[0,0])[0]} - ${(gameData.roundsWon||[0,0])[1]}`;
    }
    
    updateZombieCards();
}

// Экран кастомизации
function renderCustomizeScreen() {
    const plantGrid = document.getElementById('plantGrid');
    const zombieGrid = document.getElementById('zombieGrid');
    const myPlants = getMyPlants();
    const myZombies = getMyZombies();
    
    plantGrid.innerHTML = Object.keys(ALL_PLANTS).map(type => {
        const p = ALL_PLANTS[type];
        const selected = myPlants.includes(type);
        return `<div class="select-card ${selected?'selected':''}" onclick="togglePlant('${type}')" style="background:${p.color}33">
            <span class="icon">${p.icon}</span>${p.name}
        </div>`;
    }).join('');
    
    zombieGrid.innerHTML = Object.keys(ALL_ZOMBIES).map(type => {
        const z = ALL_ZOMBIES[type];
        const selected = myZombies.includes(type);
        return `<div class="select-card ${selected?'selected':''}" onclick="toggleZombie('${type}')" style="background:${z.color}33">
            <span class="icon">${z.icon}</span>${z.name}
        </div>`;
    }).join('');
}

let selectedPlants = ['sunflower','peashooter','snowpea','walnut','cherrybomb'];
let selectedZombies = ['basic','cone','bucket','runner','gargantuar'];

function togglePlant(type) {
    if (selectedPlants.includes(type)) {
        if (selectedPlants.length > 1) selectedPlants = selectedPlants.filter(t => t !== type);
    } else if (selectedPlants.length < 5) {
        selectedPlants.push(type);
    }
    socket.emit('setPlants', selectedPlants);
    renderCustomizeScreen();
}

function toggleZombie(type) {
    if (selectedZombies.includes(type)) {
        if (selectedZombies.length > 1) selectedZombies = selectedZombies.filter(t => t !== type);
    } else if (selectedZombies.length < 5) {
        selectedZombies.push(type);
    }
    socket.emit('setZombies', selectedZombies);
    renderCustomizeScreen();
}

function startGame() {
    socket.emit('startGame');
}

// Зомби-карточки
function updateZombieCards() {
    const container = document.getElementById('zombieBtns');
    const myZombies = getMyZombies();
    container.innerHTML = myZombies.map(type => {
        const z = ALL_ZOMBIES[type] || {};
        const locked = (z.tier||0) > (gameData.unlockedTiers||0);
        return `<div class="zombie-card ${type} ${locked?'locked':''} ${selectedZombie===type?'selected':''}" 
            onclick="selectZombieCard('${type}')" style="background:${z.color||'#555'}33">
            <span class="zombie-icon">${z.icon||'🧟'}</span>${z.name||type}
            <span class="zombie-cost">⚡${z.cost||30}</span>
        </div>`;
    }).join('');
}

function selectZombieCard(type) {
    const z = ALL_ZOMBIES[type];
    if ((z.tier||0) > (gameData.unlockedTiers||0)) return;
    selectedZombie = selectedZombie === type ? null : type;
    updateZombieCards();
}

function selectMode(mode) { socket.emit('selectMode', mode); }
function nextRound() { socket.emit('nextRound'); }
function restartGame() {
    socket.emit('restart');
    document.getElementById('modeSelect').classList.add('show');
}

// Клики по канвасу
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = 950 / rect.width;
    const scaleY = 600 / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;
    
    if (myRole === 'defender' && gameData.phase === 'playing') {
        // Сбор солнца
        if (gameData.sunDrops) {
            for (let i=0; i<gameData.sunDrops.length; i++) {
                const s = gameData.sunDrops[i];
                if (s.alive===false) continue;
                if (Math.hypot(x-s.x, y-s.y) < 22) {
                    socket.emit('collect', { id: i });
                    return;
                }
            }
        }
        // Выбор растения в верхней панели
        if (y < 80 && y > 0) {
            const plants = getMyPlants();
            for (let i=0; i<plants.length; i++) {
                const bx = 10 + i*110;
                if (x >= bx && x <= bx+100) {
                    const type = plants[i];
                    const p = ALL_PLANTS[type];
                    if ((gameData.sunPoints||0) >= p.cost && !(gameData.plantCooldowns?.[type] > 0))
                        selectedPlant = selectedPlant === type ? null : type;
                    return;
                }
            }
        }
        // Посадка
        if (selectedPlant && y > 120) {
            const col = Math.floor((x-150)/85);
            const row = Math.floor((y-120)/90);
            if (col>=0 && col<9 && row>=0 && row<5) {
                socket.emit('plant', { type: selectedPlant, row, col });
            }
        }
    }
    
    if (myRole === 'attacker' && gameData.phase === 'playing' && !gameData.spawnLocked && selectedZombie && y > 120) {
        const row = Math.floor((y-120)/90);
        if (row>=0 && row<5) {
            socket.emit('zombie', { type: selectedZombie, row });
        }
    }
});

// Клавиатура
document.addEventListener('keydown', (e) => {
    if (myRole !== 'attacker' || gameData.spawnLocked || gameData.phase !== 'playing') return;
    const key = e.key.toLowerCase();
    const zombies = getMyZombies();
    let type = null, row = Math.floor(Math.random()*5);
    if (key>='1' && key<='5') { type = zombies[parseInt(key)-1]; row = parseInt(key)-1; }
    else if (key==='q') type = zombies[1] || 'cone';
    else if (key==='w') type = zombies[2] || 'bucket';
    else if (key==='e') type = zombies[3] || 'runner';
    else if (key==='r') type = zombies[4] || 'gargantuar';
    if (type) {
        socket.emit('zombie', { type, row });
        selectedZombie = type;
    }
});

// Отрисовка
function draw() {
    ctx.clearRect(0,0,950,600);
    if (!gameData.plants) {
        ctx.fillStyle='#fff';ctx.font='18px Arial';ctx.textAlign='center';
        ctx.fillText(gameData.phase==='customize'?'Настройте войска':'Ожидание...',475,300);
        ctx.textAlign='left';return;
    }
    
    // Газон
    for (let r=0;r<5;r++) for (let c=0;c<9;c++) {
        ctx.fillStyle=(r+c)%2===0?'#7cb342':'#8bc34a';
        ctx.fillRect(150+c*85,120+r*90,83,88);
    }
    // Газонокосилки
    if (gameData.lawnmowers) gameData.lawnmowers.forEach((active,row)=>{
        if(active){ctx.fillStyle='#c62828';ctx.fillRect(115,145+row*90,30,15);ctx.fillStyle='#fff';ctx.font='8px Arial';ctx.fillText('ГАЗОН',116,155+row*90);}
    });
    
    // Верхняя панель защитника
    if (myRole === 'defender' && gameData.phase === 'playing') {
        ctx.fillStyle='#1b5e20';ctx.fillRect(0,0,950,80);
        const plants = getMyPlants();
        plants.forEach((type,i)=>{
            const p = ALL_PLANTS[type]||{};
            const x = 10+i*110;
            const canBuy = (gameData.sunPoints||0) >= (p.cost||0);
            const onCooldown = (gameData.plantCooldowns?.[type]||0) > 0;
            ctx.fillStyle = selectedPlant===type?'#fff9c4':(onCooldown?'#555':(canBuy?'#c8e6c9':'#666'));
            ctx.fillRect(x,10,100,60);
            ctx.fillStyle = onCooldown?'#888':(p.color||'#888');
            ctx.beginPath();ctx.arc(x+50,28,14,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#fff';ctx.font='10px Arial';ctx.textAlign='center';
            ctx.fillText(p.name||type,x+50,50);
            ctx.fillText(onCooldown?`⏳${Math.ceil(gameData.plantCooldowns[type])}с`:`☀${p.cost||0}`,x+50,65);
        });
        ctx.textAlign='left';
        ctx.fillStyle='#fff';ctx.font='bold 16px Arial';
        ctx.fillText('☀ '+(gameData.sunPoints||0),580,45);
        ctx.fillText('🔫 '+(selectedPlant?ALL_PLANTS[selectedPlant]?.name||selectedPlant:'Нет'),580,65);
    }
    
    // Верхняя панель атакующего
    if (myRole === 'attacker' && gameData.phase === 'playing') {
        ctx.fillStyle='#4a148c';ctx.fillRect(0,0,950,80);
        ctx.fillStyle='#fff';ctx.font='bold 16px Arial';
        ctx.fillText('⚡ '+(gameData.zombieEnergy||0)+'/'+(gameData.maxEnergy||300),15,35);
        ctx.fillText('🧟 '+(selectedZombie?ALL_ZOMBIES[selectedZombie]?.name||selectedZombie:'Выберите'),15,60);
        if (gameData.spawnLocked) {ctx.fillStyle='#ff5722';ctx.font='13px Arial';ctx.fillText('Спавн через '+(gameData.prepTimer||0)+'с',15,75);}
    }
    
    // Солнце
    if (gameData.sunDrops) gameData.sunDrops.forEach(s=>{
        if (s.alive===false) return;
        ctx.fillStyle='rgba(255,235,59,0.4)';ctx.beginPath();ctx.arc(s.x,s.y,16,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffeb3b';ctx.beginPath();ctx.arc(s.x,s.y,12,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';
        ctx.fillText('☀',s.x,s.y+5);ctx.textAlign='left';
    });
    
    // Растения
    if (gameData.plants) gameData.plants.forEach(p=>{
        const color = ALL_PLANTS[p.type]?.color || '#888';
        ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,18,0,Math.PI*2);ctx.fill();
        if (p.hp < p.maxHp) {
            ctx.fillStyle='#333';ctx.fillRect(p.x-15,p.y-28,30,4);
            ctx.fillStyle=p.hp/p.maxHp>0.5?'#4caf50':'#ff9800';
            ctx.fillRect(p.x-15,p.y-28,30*(p.hp/p.maxHp),4);
        }
    });
    
    // Зомби
    if (gameData.zombies) gameData.zombies.forEach(z=>{
        const color = ALL_ZOMBIES[z.type]?.color || '#9ccc65';
        ctx.fillStyle=color;ctx.fillRect(z.x-10,z.y-15,20,30);
        if (z.doorHp>0) {ctx.fillStyle='#8d6e63';ctx.fillRect(z.x-12,z.y-20,24,8);}
        ctx.fillStyle='#c8e6c9';ctx.beginPath();ctx.arc(z.x,z.y-18,10,0,Math.PI*2);ctx.fill();
        if (z.slowed) {ctx.fillStyle='rgba(130,210,255,0.4)';ctx.beginPath();ctx.arc(z.x,z.y,20,0,Math.PI*2);ctx.fill();}
    });
    
    // Снаряды
    if (gameData.projectiles) gameData.projectiles.forEach(p=>{
        ctx.fillStyle = p.fire ? '#ff9800' : (p.homing ? '#ff4081' : '#a5d6a7');
        ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();
    });
    
    // Конец игры
    if (gameData.gameOver) {
        ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,950,600);
        ctx.fillStyle='#fff';ctx.font='28px Arial';ctx.textAlign='center';
        ctx.fillText(gameData.winner==='defender'?'🌱 Защитник выстоял!':gameData.winner==='attacker'?'🧟 Зомби прорвались!':'⏰ Время вышло!',475,270);
        ctx.font='18px Arial';
        ctx.fillText(`Время: ${Math.floor((gameData.elapsedTime||0)/60)}:${String(Math.floor((gameData.elapsedTime||0)%60)).padStart(2,'0')}`,475,300);
    }
    ctx.textAlign='left';
}

function gameLoop() { draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>
</body>
</html>
